<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
    <!-- Head -->
    <rect x="24" y="0" width="16" height="16" fill="#80623C"/>
    <!-- Hair -->
    <rect x="24" y="0" width="16" height="4" fill="#000000"/>
    <!-- Body -->
    <rect x="24" y="16" width="16" height="32" fill="#80623C"/>
    <!-- Legs -->
    <rect x="24" y="48" width="8" height="16" fill="#000000"/>
    <rect x="32" y="48" width="8" height="16" fill="#000000"/>
    <!-- Arms -->
    <rect x="16" y="16" width="8" height="32" fill="#80623C"/>
    <rect x="40" y="16" width="8" height="32" fill="#80623C"/>
    <!-- Hoodie -->
    <rect x="20" y="12" width="24" height="20" fill="#FFFF00"/>
    <!-- Letters on Hoodie -->
    <text x="32" y="24" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">GJ</text>
    <text x="32" y="36" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">K</text>
</svg>